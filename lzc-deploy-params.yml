params:
    - id: timezone
      type: string
      name: "Timezone"
      description: "IANA timezone for logs, scheduled tasks and certificate renewal, e.g. Asia/Shanghai."
      default_value: "Asia/Shanghai"

    - id: initial_password
      type: secret
      name: "Initial Admin Password"
      description: "Password for the admin account on first start. Only used when Gately has no account yet; later changes made in the UI are remembered automatically."
      default_value: "$random(len=20)"
      optional: false

locales:
    zh:
        timezone:
            name: "时区"
            description: "日志、计划任务与证书续期使用的 IANA 时区，默认北京时间（Asia/Shanghai）。"
        initial_password:
            name: "初始管理员密码"
            description: "首次启动时为 admin 账号设置的密码。仅在 Gately 尚无账号时生效；之后在界面里改密会被自动记住。"
    zh_CN:
        timezone:
            name: "时区"
            description: "日志、计划任务与证书续期使用的 IANA 时区，默认北京时间（Asia/Shanghai）。"
        initial_password:
            name: "初始管理员密码"
            description: "首次启动时为 admin 账号设置的密码。仅在 Gately 尚无账号时生效；之后在界面里改密会被自动记住。"
    en:
        timezone:
            name: "Timezone"
            description: "IANA timezone used for logs, cron jobs and certificate renewal. Defaults to Asia/Shanghai."
        initial_password:
            name: "Initial Admin Password"
            description: "Password for the admin account on first start. Only used when Gately has no account yet."
